<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuraStudy | 极简美学看板</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ambient-glow">
        <div class="glow-sphere sphere-cyan"></div>
        <div class="glow-sphere sphere-pink"></div>
    </div>

    <div class="app-container">
        
        <main id="mainDashboard" class="view-stage active">
            <header class="dashboard-header">
                <div class="logo-area">
                    <span class="logo-dot"></span>
                    <h2>NEURA</h2>
                </div>
                <div class="add-subject-box">
                    <input type="text" id="newSubjectName" placeholder="新学科名称" class="glass-input">
                    <input type="date" id="newSubjectDate" class="glass-input">
                    <button onclick="actions.addSubject()" class="btn-minimal-add">添加轨道</button>
                </div>
            </header>

            <div class="subjects-slider-wrapper">
                <div id="subjectsContainer" class="subjects-grid">
                    </div>
            </div>
        </main>

        <section id="subjectWorkspace" class="view-stage">
            <header class="workspace-header">
                <button onclick="actions.backToDashboard()" class="btn-back">← 返回看板</button>
                <h2 id="currentSubjectTitle" class="current-title">Loading</h2>
            </header>

            <div class="workspace-grid">
                <div class="glass-card panel-tasks">
                    <div class="panel-header">
                        <h3 class="panel-title">NODES / 知识拆解</h3>
                        <div class="task-input-group">
                            <input type="text" id="newTaskInput" placeholder="注入新节点..." class="glass-input">
                            <button onclick="actions.addTodo()" class="btn-inline-add">+</button>
                        </div>
                    </div>
                    <div class="scroll-container">
                        <ul id="todoContainer" class="interactive-list"></ul>
                    </div>
                </div>

                <div class="glass-card panel-notes">
                    <h3 class="panel-title">NOTES / 深度笔记</h3>
                    <textarea id="noteTextarea" placeholder="在此沉淀核心思维逻辑...（已开启原子化自动保存）" oninput="actions.saveNotes()"></textarea>
                </div>

                <div class="glass-card panel-files">
                    <h3 class="panel-title">MATERIALS / 资料矩阵</h3>
                    <div class="file-drop-zone" id="dropZone">
                        <input type="file" id="fileInput" multiple style="display: none;" onchange="actions.handleFileUpload(this.files)">
                        <div class="drop-prompt" onclick="document.getElementById('fileInput').click()">
                            <p>将复习资料拖拽至此或点击上传</p>
                        </div>
                    </div>
                    <ul id="fileContainer" class="file-list"></ul>
                </div>
            </div>
        </section>

    </div>
    <script src="script.js"></script>
</body>
</html>
