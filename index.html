<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的学习助手</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📚 我的学习助手</h1>
        
        <div class="card">
            <h2>⏳ 考试倒计时</h2>
            <div id="countdown" class="highlight">正在计算时间...</div>
        </div>

        <div class="card">
            <h2>📈 学习进度</h2>
            <div class="progress-bar">
                <div class="progress" id="myProgress" style="width: 60%;">60%</div>
            </div>
            <p>已完成 6 / 10 个章节</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
